{% extends "base.html" %}

{% block content %}

<h1>Dashboard</h1>
<h3>Total Expenses: ${{ total_expenses }}</h3>
<a href="{{ url_for('expenses.add_expense') }}"
   class="btn btn-primary">
   Add Expense
</a>
<hr>
<h4>Recent Transactions</h4>

<ul class "list-group">
    {% for expense in recent_transactions %}
    <li class="list-group-item">

        {{ expense.category }} -
        ${{ expense.amount }} 
        
    </li>

    {% endfor %}

</ul>
{% endblock %}
